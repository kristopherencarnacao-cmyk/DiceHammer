<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiceHammer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>DiceHammer</title>
<style>
/* Layout: one-screen phosphor terminal — header strip, pool/result readout, bracketed 8×8 tray that fills spare height, control bar.
   Deliberately one look: cold black, ash-white text, phosphor green as the only accent, blood red for 1s. */
:root{
  color-scheme:dark;
  --ash:#05070a; --slab:#0e1217; --raise:#151a21; --ink:#dfe4ea; --muted:#8792a0; --rule:#232b35;
  --brass:#55e6a5; --seal-hi:#8af5c4; --phos-deep:#2a9d6c; --brass-soft:#0b231b; --phos-dim:#1f5a45; --phos-ink:#02140d;
  --danger:#e04652; --gold:#f5c451; --gold-glow:rgba(245,196,81,.45); --blood:#1f080c; --blood-hi:#45121a;
  --glow:rgba(85,230,165,.45); --glow-soft:rgba(85,230,165,.18); --red-glow:rgba(224,70,82,.45); --deep-shadow:rgba(0,0,0,.6);
  --term:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
html,body{height:100%;overflow:hidden}
/* no double-tap zoom: fast taps on dice and buttons stay taps */
html,body,button,.app{touch-action:manipulation}
body{background-color:var(--ash);color:var(--ink);font-family:var(--term);font-size:14px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 110% 70% at 50% 0%,rgba(60,140,110,.10),transparent 60%),radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
/* CRT: scanlines, vignette and a slow sweep, never blocking input */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.42) 100%)}
body::before{content:"";position:fixed;left:0;right:0;top:-20%;height:20%;pointer-events:none;z-index:9998;
  background:linear-gradient(180deg,transparent,rgba(85,230,165,.035),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{to{transform:translateY(600%)}}
::selection{background:var(--brass);color:var(--phos-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--brass);outline-offset:3px;box-shadow:0 0 0 3px var(--glow-soft)}

.app{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}

/* header strip */
.mast{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:24px;line-height:1;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);text-shadow:0 0 12px var(--glow),0 0 2px rgba(85,230,165,.8);white-space:nowrap}
@media (max-width:380px){.eyebrow{font-size:20px;letter-spacing:.12em}}
.cursor{display:inline-block;width:.55em;height:.9em;margin-left:.2em;background:var(--brass);vertical-align:-.1em;box-shadow:0 0 8px var(--glow);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.k-lbl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.k-lbl::before{content:"// ";color:var(--phos-dim)}

/* buttons: square, phosphor-lit */
.btn{background:transparent;border:1px solid var(--phos-dim);border-radius:0;color:var(--brass);font:600 11px/1.15 var(--term);text-transform:uppercase;letter-spacing:.08em;transition:background .15s,box-shadow .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--brass-soft);border-color:var(--brass);box-shadow:0 0 12px var(--glow-soft)}
.btn:active:not(:disabled){background:var(--brass);color:var(--phos-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--phos-ink);box-shadow:0 0 14px var(--glow-soft)}
.btn.primary:hover:not(:disabled){background:var(--seal-hi);border-color:var(--seal-hi)}
.btn.primary:disabled{background:transparent;color:var(--muted);border-color:var(--phos-dim);box-shadow:none;opacity:.5}
.hist{height:30px;padding-inline:10px;display:inline-flex;align-items:center;gap:8px}
.hist::before{content:"[";opacity:.6}.hist::after{content:"]";opacity:.6}
.hist .n{color:var(--ink);font-variant-numeric:tabular-nums}

/* readout */
/* fixed rows (label / number / status line) so nothing moves between idle, rolling and result states */
.readout{--big:38px;--lbl:12px;--subh:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex:none}
.readout .k-lbl{height:var(--lbl);line-height:var(--lbl);white-space:nowrap}
.left{display:flex;align-items:flex-end;gap:8px;padding-bottom:calc(var(--subh) + 3px)}
.step{width:34px;height:34px;font-size:18px;font-weight:700;padding:0}
.pool{display:flex;flex-direction:column;gap:3px}
.big{font-weight:700;font-size:var(--big,38px);height:var(--big,38px);line-height:var(--big,38px);font-variant-numeric:tabular-nums;white-space:nowrap}
#count .n{display:inline-block;min-width:2ch;text-align:right}
/* tray sizes: small 5×5, medium 8×8, large 12×12 */
.grid[data-size="s"]{gap:6px}
.grid[data-size="l"]{gap:3px;padding:7px}
.grid[data-size="l"] .cell{padding:15%;gap:8%;border-radius:16%}
body.size-l #count .n,body.size-l .stat .big{min-width:3ch}
body.size-l .readout{--big:28px}
@media (max-width:380px){body.size-l .readout{--big:23px}body.size-l .stats{gap:10px}}
.big small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:.1em}
#count{color:var(--ink)}
.right{flex:1;min-width:0;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#hits{color:var(--brass);text-shadow:0 0 12px var(--glow),0 0 2px rgba(85,230,165,.8)}
.right .sub{height:var(--subh);line-height:var(--subh);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* the status line uses the full readout width (the pool side has nothing on that row) */
.readout{position:relative}
.right{padding-bottom:calc(var(--subh) + 3px)}
.right .sub{position:absolute;right:0;bottom:0;max-width:100%}
/* the status line under the result is hidden; the readout keeps just the label and numbers */
.right .sub{display:none!important}
.left{padding-bottom:0}
.right{padding-bottom:0}
.right .sub:not(:empty)::before{content:"> ";color:var(--brass)}
/* results: hits / crit / fail, each a label over a number */
.stats{display:flex;gap:16px;justify-content:flex-end}
.stat{display:flex;flex-direction:column;gap:3px;align-items:flex-end;min-width:2ch}
.stat .k-lbl::before{content:none}
.stat .big{min-width:2ch;text-align:right}
#crits{color:var(--gold);text-shadow:0 0 12px var(--gold-glow),0 0 2px rgba(245,196,81,.8)}
#fails{color:var(--danger);text-shadow:0 0 12px var(--red-glow)}
.right.idle .stat .big{color:var(--muted);text-shadow:none;opacity:.6}
#hits.tick,#crits.tick,#fails.tick{animation:tick .4s steps(5) both}
.critrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:center;justify-items:center;margin-top:-4px}
.critrow .k-lbl{font-size:9.5px;letter-spacing:.1em}
.critrow .k-lbl::before{content:none}
.chk{width:22px;height:22px;padding:0;border:1px solid var(--phos-dim);background:transparent;display:grid;place-items:center;transition:background .15s,border-color .15s,box-shadow .15s}
.chk svg{width:14px;height:14px;opacity:0}
.chk:hover{border-color:var(--brass);background:var(--brass-soft)}
.chk[aria-checked="true"]{background:linear-gradient(155deg,var(--seal-hi),var(--brass) 60%,var(--phos-deep));border-color:var(--seal-hi);box-shadow:0 0 10px var(--glow)}
.chk[aria-checked="true"] svg{opacity:1}
@keyframes tick{0%{opacity:.15}20%{opacity:1}40%{opacity:.45}60%{opacity:1}80%{opacity:.7}100%{opacity:1}}

/* bracketed panel, as in the Codex */
.frame{--fr:var(--brass);--bk:12px;--bt:2px;
  background:
    linear-gradient(var(--fr),var(--fr)) 0 0/var(--bk) var(--bt) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 0 0/var(--bt) var(--bk) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 100% 0/var(--bk) var(--bt) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 100% 0/var(--bt) var(--bk) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 0 100%/var(--bk) var(--bt) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 0 100%/var(--bt) var(--bk) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 100% 100%/var(--bk) var(--bt) no-repeat,
    linear-gradient(var(--fr),var(--fr)) 100% 100%/var(--bt) var(--bk) no-repeat,
    linear-gradient(180deg,rgba(85,230,165,.035),transparent 40%),
    var(--slab);
  border:1px solid var(--phos-dim);border-radius:0;
  box-shadow:inset 0 0 22px rgba(85,230,165,.05),0 0 0 1px rgba(0,0,0,.6),0 12px 30px var(--deep-shadow)}

/* the tray */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.grid{--n:8;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:4px;padding:8px;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;perspective:600px}
.cell{position:relative;border-radius:12%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:6%;padding:18%;box-sizing:border-box;min-width:0;min-height:0;
  background:radial-gradient(circle,var(--phos-dim) 0 1.5px,transparent 2px);box-shadow:inset 0 0 0 1px rgba(85,230,165,.06);transition:opacity .2s}
.cell i{border-radius:50%;visibility:hidden}
.cell b{display:none}
.cell svg{position:absolute;inset:14%;width:72%;height:72%;visibility:hidden}

/* a die: dark glass with phosphor pips */
.cell.on,.die{background:linear-gradient(155deg,rgba(85,230,165,.15),rgba(85,230,165,.03) 55%,rgba(0,0,0,.3)),var(--raise);
  box-shadow:inset 0 0 0 1px var(--phos-dim),inset 1px 1px 0 rgba(200,255,230,.09),inset -2px -3px 6px rgba(0,0,0,.45),0 3px 6px var(--deep-shadow)}
.cell.on i.s,.die i.s{visibility:visible}
.cell.on i,.die i{background:var(--brass);box-shadow:0 0 4px var(--glow)}
.grid.rolled .cell:not(.on){opacity:.3}
.cell.hit{box-shadow:inset 0 0 0 1px var(--brass),inset -2px -3px 6px rgba(0,0,0,.45),0 0 10px var(--glow-soft),0 3px 6px var(--deep-shadow)}
.cell.miss{opacity:.3}
.cell.on.miss i{background:var(--muted);box-shadow:none}

/* 6s: lit phosphor, pulsing, sparking */
.grid.rolled .cell.on.six{background:linear-gradient(155deg,var(--seal-hi),var(--brass) 55%,var(--phos-deep));
  box-shadow:inset 0 0 0 1px var(--seal-hi),inset -2px -3px 6px rgba(0,40,20,.35),0 0 14px var(--glow),0 3px 6px var(--deep-shadow);opacity:1;z-index:2}
.grid.rolled .cell.on.six i{background:var(--phos-ink);box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.grid.rolled .cell.on.six.miss{opacity:.6}
.cell.six{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0ms)}
.cell.six.quiet{animation:none}
@keyframes pop{0%{transform:scale(1);filter:brightness(2.4)}40%{transform:scale(1.28)}100%{transform:scale(1);filter:none}}
.cell.six::after{content:"";position:absolute;inset:-3px;border-radius:16%;box-shadow:0 0 14px 3px var(--glow);opacity:0;pointer-events:none;
  animation:glow .9s ease-out both,pulse 2s ease-in-out infinite;animation-delay:var(--d,0ms),calc(var(--d,0ms) + .9s)}
@keyframes glow{0%{opacity:0}25%{opacity:1}100%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.95}}
.tw{position:absolute;inset:0;pointer-events:none;z-index:3}
.tw s{position:absolute;width:30%;height:30%;background:var(--seal-hi);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:twinkle 1.8s ease-in-out infinite}
.tw s:nth-child(1){top:-12%;right:-10%}
.tw s:nth-child(2){bottom:-10%;left:-12%;width:22%;height:22%}
.tw s:nth-child(3){top:-8%;left:-6%;width:18%;height:18%}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.4) rotate(90deg)}}
.spark{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
.spark s{position:absolute;left:-3px;top:-3px;width:6px;height:6px;background:var(--seal-hi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:fly .7s ease-out both;animation-delay:var(--d,0ms)}
@keyframes fly{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(.4)}60%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) scale(1.1)}}

/* 1s: blood-red glass with a skull */
.grid.rolled .cell.on.one{background:linear-gradient(155deg,var(--blood-hi),var(--blood));box-shadow:inset 0 0 0 1px var(--danger),0 0 10px var(--red-glow),0 3px 6px var(--deep-shadow);opacity:.9}
.grid.rolled .cell.on.one i.s{visibility:hidden}
.grid.rolled .cell.on.one svg{visibility:visible;color:var(--danger);filter:drop-shadow(0 0 3px var(--red-glow))}
.grid.rolled .cell.on.one.hit{opacity:1}

/* motion: materialise, glitch-roll, land */
.cell.drop{animation:mat .45s ease-out both;animation-delay:var(--dd,0ms)}
@keyframes mat{0%{opacity:0;transform:scale(1.4);filter:blur(4px) brightness(2.5)}30%{opacity:.9;filter:blur(1px) brightness(1.8)}45%{opacity:.3}60%{opacity:1;transform:scale(.96);filter:none}75%{opacity:.6}100%{opacity:1;transform:none}}
.cell.spin{animation:glitchRoll .5s steps(1) infinite;animation-delay:var(--gd,0s)}
/* rolling: a gentle signal-glitch. Small sideways jumps, one thin slice and a soft flicker, out of sync between dice */
@keyframes glitchRoll{
  0%{transform:none;clip-path:inset(0);filter:brightness(1.25);box-shadow:-1px 0 0 rgba(224,70,82,.3),1px 0 0 rgba(85,230,165,.35)}
  25%{transform:translateX(-1px);filter:brightness(1)}
  50%{transform:translateX(1px);clip-path:inset(30% 0 22% 0);filter:brightness(1.4)}
  60%{clip-path:inset(0)}
  75%{transform:none;opacity:.8;filter:brightness(1.1)}
}
.grid.rolled .cell.on.land:not(.six):not(.one){animation:land .35s ease-out both}
@keyframes land{0%{transform:scale(1.12);filter:brightness(2.2)}100%{transform:none;filter:none}}
.grid.rolled .cell.on.one.land{animation:glitch .36s steps(1) both}
@keyframes glitch{0%{transform:translate(-3px,1px);filter:brightness(2)}20%{transform:translate(3px,-1px)}40%{transform:translate(-2px,0);filter:brightness(1.4)}60%{transform:translate(2px,1px)}80%{transform:translate(-1px,0)}100%{transform:none;filter:none}}

/* control bar */
.bar{display:flex;flex-direction:column;gap:10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.acts{display:flex;gap:6px}
.acts .btn{flex:1 1 0;min-width:0;height:40px;padding-inline:4px}
.hint{margin-bottom:-4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.hint::before{content:"> ";color:var(--brass)}
.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.face{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.die{width:100%;max-width:54px;aspect-ratio:1;border-radius:12%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:6%;padding:18%;box-sizing:border-box;transition:transform .1s,box-shadow .15s}
.die i{border-radius:50%;visibility:hidden}
.face:hover .die{box-shadow:inset 0 0 0 1px var(--brass),0 0 10px var(--glow-soft),0 3px 6px var(--deep-shadow)}
.face:active .die{transform:scale(.92)}
.face span{font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.face.sel .die{background:linear-gradient(155deg,var(--seal-hi),var(--brass) 60%,var(--phos-deep));box-shadow:inset 0 0 0 1px var(--seal-hi),0 0 14px var(--glow)}
.face.sel .die i{background:var(--phos-ink);box-shadow:none}
.face.sel span{color:var(--brass);text-shadow:0 0 8px var(--glow)}

/* roll log */
.scrim{position:fixed;inset:0;background:rgba(1,6,4,.8);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);max-height:75%;z-index:21;display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);border-bottom:0;--bk:16px}
.sheet:not([hidden]){animation:sheetIn .3s ease-out both}
@keyframes sheetIn{0%{opacity:0;transform:translate(-50%,24px)}40%{opacity:.6}55%{opacity:.25}100%{opacity:1;transform:translate(-50%,0)}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px dashed var(--phos-dim)}
.sheet-head .k-lbl{flex:1;font-size:11px;color:var(--brass)}
.sheet-head .btn{height:30px;padding-inline:10px}
.h-list{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0}
.h-item{width:100%;display:grid;grid-template-columns:14px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;background:none;border:0;border-bottom:1px dashed var(--phos-dim);text-align:left;color:var(--ink);position:relative}
.h-list li:last-child .h-item{border-bottom:0}
.h-item::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1px;background:var(--phos-dim)}
.h-list li:first-child .h-item::before{top:50%}
.h-list li:last-child .h-item::before{bottom:50%}
.h-list li:only-child .h-item::before{display:none}
.h-item:hover{background:rgba(85,230,165,.05)}
.h-item.cur{background:var(--brass-soft)}
.h-dot{width:8px;height:8px;transform:rotate(45deg);border:2px solid var(--phos-dim);background:var(--slab);position:relative;z-index:1;justify-self:center}
.h-item.cur .h-dot{background:var(--brass);border-color:var(--brass);box-shadow:0 0 8px var(--glow)}
.h-hits{font-weight:700;font-size:22px;line-height:1;color:var(--brass);text-shadow:0 0 8px var(--glow);text-align:center;font-variant-numeric:tabular-nums}
.h-mid{min-width:0;display:flex;flex-direction:column;gap:6px}
.h-title{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.strip{display:flex;flex-wrap:wrap;gap:2px}
.strip i{width:7px;height:7px;background:var(--phos-dim);opacity:.6}
.strip i.h{background:var(--brass);opacity:1}
.strip i.s6{background:var(--seal-hi);opacity:1;box-shadow:0 0 4px var(--glow)}
.strip i.s1{background:var(--danger);opacity:1}
.h-time{font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;align-self:start}
.h-item.cur .h-time{color:var(--brass)}
.h-empty{color:var(--muted);font-size:12px;letter-spacing:.04em;text-align:center;padding:28px 16px}
.h-empty::before{content:"> ";color:var(--brass)}

/* curved CRT glass: rounded bezel corners, barrel shading and a glass highlight (visual only, never blocks input) */
.crt-glass{position:fixed;inset:0;pointer-events:none;z-index:10000;border-radius:clamp(18px,4vw,42px)/clamp(24px,5vw,56px);
  box-shadow:0 0 0 80px #000,inset 0 0 0 1px rgba(85,230,165,.10),inset 0 0 26px 6px rgba(0,0,0,.85),inset 0 0 120px 20px rgba(0,0,0,.45)}
.crt-glass .crt-bulge{position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse 140% 120% at 50% 50%,transparent 58%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.6) 100%),radial-gradient(ellipse 90% 70% at 50% 45%,rgba(85,230,165,.035),transparent 70%)}
.crt-glass .crt-glare{position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse 55% 30% at 28% 10%,rgba(220,240,255,.07),transparent 70%),linear-gradient(115deg,transparent 62%,rgba(220,240,255,.025) 70%,transparent 78%)}

<body>

<main class="app">
  <header class="mast">
    <div class="eyebrow">DiceHammer<span class="cursor" aria-hidden="true"></span></div>
    <div class="menu-wrap">
      <button class="btn hist" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>Menu</button>
      <div class="menu frame" id="menu" hidden>
        <button class="m-item" id="histBtn">Roll log <span class="n" id="histN">0</span></button>
        <button class="m-item" id="guideBtn" aria-haspopup="dialog">Guide <span class="n">?</span></button>
        <div class="m-size"><div>Dice pool<small id="sizeNote">8×8 · up to 64</small></div><div class="m-seg" id="sizeSeg" role="radiogroup" aria-label="Dice pool size"><button role="radio" data-size="s" aria-label="Small, 5 by 5">S</button><button role="radio" data-size="m" aria-label="Medium, 8 by 8">M</button><button role="radio" data-size="l" aria-label="Large, 12 by 12">L</button></div></div>
      </div>
    </div>
  </header>

  <div class="readout">
    <div class="left">
      <button class="btn step" id="minus" aria-label="One fewer die">−</button>
      <div class="pool">
        <div class="k-lbl">Pool</div>
        <div class="big" id="count"><span class="n">10</span></div>
      </div>
      <button class="btn step" id="plus" aria-label="One more die">+</button>
    </div>
    <div class="right idle" id="res" aria-live="polite">
      <div class="stats">
        <div class="stat"><div class="k-lbl">Hits</div><div class="big" id="hits">--</div></div>
        <div class="stat"><div class="k-lbl">Crit</div><div class="big" id="crits">--</div></div>
        <div class="stat"><div class="k-lbl">Fail</div><div class="big" id="fails">--</div></div>
      </div>
      <div class="sub" id="sub">Tap a target to roll</div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="grid frame" id="grid" aria-label="Drag from the top left to choose how many dice"></div>
  </div>

  <div class="bar">
    <div class="acts">
      <button class="btn" id="sortBtn" disabled>Sort</button>
      <button class="btn" id="rerollOnes" disabled>Re-roll 1s</button>
      <button class="btn" id="rerollFails" disabled>Re-roll fails</button>
      <button class="btn" id="removeFails" disabled>Remove fails</button>
    </div>
    <div class="hint">Tap a target to roll · hits on it or higher</div>
    <div class="faces" id="faces"></div>
    <div class="critrow" id="critSeg" role="radiogroup" aria-label="Critical hits on"><span class="k-lbl">Crit</span></div>
  </div>
</main>

<div class="crt-band" aria-hidden="true"></div>
<div class="crt-glass" aria-hidden="true"><i class="crt-bulge"></i><i class="crt-glare"></i></div>
<div class="scrim" id="scrim" hidden></div>
<section class="guide frame" id="guide" hidden role="dialog" aria-modal="true" aria-labelledby="g-title" aria-describedby="g-body"></section>
<section class="sheet frame" id="sheet" hidden aria-label="Roll log">
  <div class="sheet-head">
    <span class="k-lbl">Roll log · this session</span>
    <button class="btn" id="histClear">Clear</button>
    <button class="btn" id="histClose">Close</button>
  </div>
  <ol class="h-list" id="histList"></ol>
</section>

<script>
(function(){
  const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const $=id=>document.getElementById(id);
  const grid=$('grid'), stage=$('stage'), facesEl=$('faces');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // fallback for older iOS Safari, which can still zoom on a quick second tap
  let lastTouch=0;
  document.addEventListener('touchend',e=>{const t=Date.now(); if(t-lastTouch<350){e.preventDefault(); if(e.target.closest('button')) e.target.closest('button').click();} lastTouch=t;},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault());
  let count=10, target=null, rolls=[], busy=false, timer=null, fresh=null, action='Rolled', slots=[], crit=6;

  const setPips=(el,v)=>{const on=PIPS[v]; el.querySelectorAll('i').forEach((p,i)=>p.classList.toggle('s',on.includes(i)));};
  // Rejection sampling: discard the top 4 values of the 32-bit range so all six faces are exactly equally likely
  const LIMIT=4294967292; // largest multiple of 6 that fits in 2^32
  const buf=new Uint32Array(1);
  const d6=()=>{do{crypto.getRandomValues(buf);}while(buf[0]>=LIMIT); return 1+(buf[0]%6);};
  // crits are hits at or above the crit threshold, and always count as successes
  const isCrit=v=>v>=crit;
  // an unmodified 1 always fails, whatever the target
  const isHit=v=>v!==1&&(v>=target||isCrit(v));

  // square tray sized to the space available
  function fit(){const s=Math.floor(Math.min(stage.clientWidth,stage.clientHeight)); grid.style.width=grid.style.height=s+'px';}
  new ResizeObserver(fit).observe(stage);

  const SKULL='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2a8 8 0 0 0-8 8c0 2.6 1.2 4.6 3 5.8V19a1 1 0 0 0 1 1h1v-2h1.5v2h3v-2H15v2h1a1 1 0 0 0 1-1v-3.2c1.8-1.2 3-3.2 3-5.8a8 8 0 0 0-8-8zM6.6 11a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0zM13 11a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0zM12 13.6l-1.3 2.3h2.6z"/></svg>';
  function clearFx(c){c.classList.remove('one','six','quiet'); c.style.removeProperty('--d'); c.querySelectorAll('.spark,.tw').forEach(x=>x.remove());}
  function sparkle(c,delay,burst=true,rad){
    c.style.setProperty('--d',delay+'ms');
    c.classList.add('six');
    if(!burst) c.classList.add('quiet');
    if(reduce||(size==='l'&&!burst)) return;
    const tw=document.createElement('span'); tw.className='tw'; tw.innerHTML='<s></s><s></s><s></s>';
    tw.querySelectorAll('s').forEach(x=>x.style.animationDelay=(delay/1000+.9+Math.random()*1.4).toFixed(2)+'s');
    c.appendChild(tw);
    if(!burst) return;
    const s=document.createElement('span'); s.className='spark';
    const r=rad||Math.round(c.offsetWidth*.85);
    for(let k=0;k<8;k++){const p=document.createElement('s'); p.style.setProperty('--a',(k*45+Math.random()*20-10)+'deg'); p.style.setProperty('--r',(r*(.7+Math.random()*.5))+'px'); s.appendChild(p);}
    c.appendChild(s); setTimeout(()=>s.remove(),800+delay);
  }
  // tray size: small 5×5, medium 8×8 (default), large 12×12; kept on this device
  const SIZES={s:5,m:8,l:12};
  let size='m'; try{const v=localStorage.getItem('dicehammer-size'); if(SIZES[v]) size=v;}catch(_){}
  let N=SIZES[size];
  const cells=[];
  function buildGrid(){
    grid.innerHTML=''; cells.length=0;
    grid.style.setProperty('--n',N); grid.dataset.size=size; document.body.classList.toggle('size-l',size==='l');
    for(let i=0;i<N*N;i++){
      const c=document.createElement('div'); c.className='cell';
      c.innerHTML='<i></i>'.repeat(9)+SKULL;
      grid.appendChild(c); cells.push(c);
    }
  }
  buildGrid();
  function tick(){['hits','crits','fails'].forEach(id=>{const h=$(id); h.classList.remove('tick'); void h.offsetWidth; if(!reduce) h.classList.add('tick');});}
  const subText=(hits,n)=>target+'+ hit · '+crit+'+ crit · avg '+(n*(7-Math.min(target,crit))/6).toFixed(1);

  function clearRoll(){
    if(timer){clearInterval(timer);timer=null;busy=false;}
    rolls=[]; grid.classList.remove('rolled');
    cells.forEach(c=>{c.classList.remove('hit','miss','spin','land'); clearFx(c);});
    $('res').classList.add('idle');
    $('hits').textContent=$('crits').textContent=$('fails').textContent='--';
    $('sub').textContent='Tap a target to roll';
    $('sortBtn').disabled=$('rerollFails').disabled=$('rerollOnes').disabled=$('removeFails').disabled=true;
  }
  // dice fill the tray in reading order; slots maps each die to its cell
  const lineSlots=n=>Array.from({length:n},(_,k)=>k);
  function setCount(n){
    n=Math.max(1,Math.min(N*N,n));
    if(n===count&&slots.length===n&&!rolls.length) return;
    count=n; slots=lineSlots(n);
    showCount(); clearRoll();
  }

  grid.addEventListener('animationend',e=>{if(e.animationName==='mat') e.target.classList.remove('drop');});
  let dragging=false;
  function pick(e){
    const r=grid.getBoundingClientRect(), pad=grid.clientLeft+parseFloat(getComputedStyle(grid).paddingLeft), w=r.width-pad*2, h=r.height-pad*2;
    const col=Math.max(0,Math.min(N-1,Math.floor((e.clientX-r.left-pad)/w*N)));
    const row=Math.max(0,Math.min(N-1,Math.floor((e.clientY-r.top-pad)/h*N)));
    setCount(row*N+col+1);
  }
  $('minus').onclick=()=>setCount(count-1);
  $('plus').onclick=()=>setCount(count+1);
  grid.addEventListener('pointerdown',e=>{dragging=true; try{grid.setPointerCapture(e.pointerId)}catch(_){} pick(e); e.preventDefault();});
  grid.addEventListener('pointermove',e=>{if(dragging) pick(e);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>grid.addEventListener(t,()=>dragging=false));

  // target faces
  for(let v=1;v<=6;v++){
    const b=document.createElement('button'); b.className='face'; b.setAttribute('aria-label','Roll, succeed on '+v+' or higher');
    b.innerHTML='<div class="die">'+'<i></i>'.repeat(9)+'</div><span>'+v+'+</span>';
    setPips(b.querySelector('.die'),v);
    b.onclick=()=>{target=v; markFaces(); roll();};
    facesEl.appendChild(b);
  }
  function markFaces(){[...facesEl.children].forEach((b,i)=>b.classList.toggle('sel',i+1===target));}

  // rolling happens in the tray cells themselves
  function animate(idx,done){
    if(reduce){done();return;}
    const lite=size==='l';
    if(lite) grid.classList.add('glitching');   // large tray: glitch the tray once, not each die
    else idx.forEach(i=>{const c=cells[slots[i]]; c.style.setProperty('--gd',(-Math.random()*.5).toFixed(2)+'s'); c.classList.add('spin');});
    const step=lite?120:60;
    let t=0; timer=setInterval(()=>{
      // large tray: shuffle a quarter of the faces each tick instead of every die
      idx.forEach(i=>{ if(!lite||Math.random()<.25) setPips(cells[slots[i]],1+Math.floor(Math.random()*6)); });
      if((t+=step)>=620){clearInterval(timer); timer=null; grid.classList.remove('glitching'); idx.forEach(i=>cells[slots[i]].classList.remove('spin')); done();}
    },step);
  }
  function lock(){$('sortBtn').disabled=$('rerollFails').disabled=$('rerollOnes').disabled=$('removeFails').disabled=true;}
  function roll(){
    if(busy||!count||!target) return; busy=true; action='Rolled';
    cells.forEach(c=>c.classList.remove('drop'));
    rolls=Array.from({length:count},d6);
    grid.classList.add('rolled');
    cells.forEach(c=>{c.classList.remove('hit','miss','land'); clearFx(c);});
    rolls.forEach((v,i)=>setPips(cells[slots[i]],v));
    $('res').classList.remove('idle'); $('hits').textContent=$('crits').textContent=$('fails').textContent='--'; $('sub').textContent='Rolling';
    lock(); animate(rolls.map((_,i)=>i),finish);
  }
  function rerollWhere(test,label){
    if(busy||!rolls.length) return;
    const idx=rolls.map((v,i)=>test(v)?i:-1).filter(i=>i>=0);
    if(!idx.length) return; busy=true; action=label;
    idx.forEach(i=>{rolls[i]=d6(); const c=cells[slots[i]]; c.classList.remove('miss','hit','land'); clearFx(c);});
    fresh=new Set(idx);
    lock(); animate(idx,finish);
  }
  // paint the current rolls; animIdx = dice that just landed (they flash, new 6s burst, new 1s glitch)
  function paintResult(animIdx){
    let hits=0, crits=0, sixNo=0; const landing=[], bursts=[];
    rolls.forEach((v,i)=>{
      const c=cells[slots[i]]; setPips(c,v); const h=isHit(v); if(h) hits++; if(isCrit(v)) crits++;
      c.classList.toggle('hit',h); c.classList.toggle('miss',!h); c.classList.toggle('one',v===1);
      const isNew=!!animIdx&&animIdx.has(i);
      if(isNew){ c.classList.remove('land'); landing.push(c); }
      if(isCrit(v)){ if(isNew&&(size!=='l'||sixNo<6)){ c.classList.remove('six'); bursts.push([c,Math.min(sixNo++*40,400)]); } else if(!c.classList.contains('six')) sparkle(c,0,false); }
    });
    // one layout pass for the whole tray (doing this per die froze the 256-die tray for seconds)
    if(landing.length||bursts.length){
      void grid.offsetWidth; const rad=Math.round(cells[0].offsetWidth*.85);
      landing.forEach(c=>c.classList.add('land'));
      bursts.forEach(([c,d])=>sparkle(c,d,true,rad));
    }
    return {hits,crits};
  }
  function syncButtons(hits){
    const n=rolls.length;
    $('rerollFails').disabled=!n||hits===n;
    $('rerollOnes').disabled=!rolls.includes(1); $('removeFails').disabled=!n||hits===n; $('sortBtn').disabled=n<2;
  }
  // newly added dice materialise in their slot showing a random resting face
  function showCount(){
    const on=new Set(slots); let k=0; const dropping=[];
    cells.forEach((c,i)=>{
      const was=c.classList.contains('on'), now=on.has(i);
      if(now&&!was){
        setPips(c,1+Math.floor(Math.random()*6));
        if(!reduce){ c.style.setProperty('--dd',Math.min(k++*(size==='l'?6:22),300)+'ms'); c.classList.remove('drop'); dropping.push(c); }
      }
      if(!now) c.classList.remove('drop');
      c.classList.toggle('on',now);
    });
    if(dropping.length){ void grid.offsetWidth; dropping.forEach(c=>c.classList.add('drop')); }
    $('count').innerHTML='<span class="n">'+count+'</span>';
  }
  function finish(){
    const idx=fresh||new Set(rolls.map((_,i)=>i)); fresh=null;
    const {hits,crits}=paintResult(idx), n=rolls.length;
    // HITS = normal successes only; crits are counted separately, so hits + crit + fail = pool
    $('hits').textContent=hits-crits; $('crits').textContent=crits; $('fails').textContent=n-hits; tick();
    $('sub').textContent=subText(hits,n);
    syncButtons(hits); busy=false;
    record(action);
  }
  $('rerollFails').onclick=()=>rerollWhere(v=>!isHit(v),'Re-rolled fails');
  $('rerollOnes').onclick=()=>rerollWhere(v=>v===1,'Re-rolled 1s');

  // keep only the successes as the new pool (e.g. hits become the wound roll)
  function removeFails(){
    if(busy||!rolls.length) return;
    const kept=rolls.filter(isHit);
    if(kept.length===rolls.length) return;
    rolls=kept; count=kept.length; slots=lineSlots(count);
    cells.forEach(c=>{c.classList.remove('hit','miss','land','spin'); clearFx(c);});
    showCount(); const {crits}=paintResult(null); syncButtons(count);
    if(count){
      $('hits').textContent=count-crits; $('crits').textContent=crits; $('fails').textContent=0; tick();
      $('sub').textContent=(count===1?'die':'dice')+' left in pool';
      record('Removed fails');
    }else{
      grid.classList.remove('rolled');
      $('res').classList.add('idle'); $('hits').textContent='0'; $('sub').textContent='No dice left · drag to pick a new pool';
    }
  }
  $('removeFails').onclick=removeFails;

  // reorder the tray highest to lowest; same dice, so the result and log entry stay the same
  function sortDice(){
    if(busy||rolls.length<2) return;
    rolls.sort((a,b)=>b-a);
    cells.forEach(c=>{c.classList.remove('hit','miss','land','spin'); clearFx(c);});
    paintResult(null);
    if(!reduce){ void grid.offsetWidth; rolls.forEach((v,i)=>cells[slots[i]].classList.add('land')); }
    const e=history.find(x=>x.id===curId);
    if(e&&e.rolls.length===rolls.length){e.rolls=rolls.slice(); save(); renderHistory();}
  }
  $('sortBtn').onclick=sortDice;

  // ---- session log ----
  let history=[], curId=null;
  try{history=JSON.parse(sessionStorage.getItem('d6-tray-history')||'[]')||[];}catch(_){history=[];}
  function save(){try{sessionStorage.setItem('d6-tray-history',JSON.stringify(history));}catch(_){}}
  function record(label){
    const id=(history.length?history[history.length-1].id:0)+1;
    history.push({id,t:Date.now(),label,target,rolls:rolls.slice(),crit,critsText:$('crits').textContent,failsText:$('fails').textContent,hitsText:$('hits').textContent,sub:$('sub').textContent});
    if(history.length>200) history.shift();
    curId=id; save(); renderHistory();
  }
  function restore(id){
    const e=history.find(x=>x.id===id); if(!e||busy) return;
    target=e.target; markFaces(); crit=e.crit||6; markCrit();
    if(e.rolls.length>N*N) setSize(Object.keys(SIZES).find(k=>SIZES[k]*SIZES[k]>=e.rolls.length)||'l',true);
    rolls=e.rolls.slice(0,N*N); count=rolls.length; slots=lineSlots(count);
    cells.forEach(c=>{c.classList.remove('hit','miss','land','spin'); clearFx(c);});
    showCount(); grid.classList.add('rolled'); $('res').classList.remove('idle');
    const {hits,crits}=paintResult(null);
    $('hits').textContent=hits-crits; $('crits').textContent=crits; $('fails').textContent=rolls.length-hits; tick(); $('sub').textContent=e.sub;
    syncButtons(hits); curId=id; renderHistory(); closeSheet();
  }
  const fmtTime=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  function renderHistory(){
    $('histN').textContent=history.length;
    const list=$('histList');
    if(!history.length){list.innerHTML='<li class="h-empty">No rolls logged. Every roll this session lands here; tap one to restore it.</li>'; return;}
    list.innerHTML=history.slice().reverse().map(e=>{
      const ec=e.crit||6, strip=e.rolls.map(v=>'<i class="'+(v>=ec?'s6':v===1?'s1':v>=e.target?'h':'')+'"></i>').join('');
      const nc=e.critsText!=null?e.critsText:e.rolls.filter(v=>v>=ec).length;
      const nf=e.failsText!=null?e.failsText:e.rolls.filter(v=>v===1||(v<e.target&&v<ec)).length;
      return '<li><button class="h-item'+(e.id===curId?' cur':'')+'" data-id="'+e.id+'">'+
        '<span class="h-dot"></span>'+
        '<span class="h-hits">'+e.hitsText+'</span>'+
        '<span class="h-mid"><span class="h-title">'+e.label+' · '+e.rolls.length+'D6 · '+e.target+'+ · '+nc+' crit'+(ec!==6?' ('+ec+'+)':'')+' · '+nf+' fail</span><span class="strip">'+strip+'</span></span>'+
        '<span class="h-time">'+(e.id===curId?'NOW':fmtTime(e.t))+'</span></button></li>';
    }).join('');
  }
  $('histList').addEventListener('click',ev=>{const b=ev.target.closest('.h-item'); if(b) restore(Number(b.dataset.id));});
  function openSheet(){$('scrim').hidden=false; $('sheet').hidden=false; const c=$('histList').querySelector('.cur'); if(c) c.scrollIntoView({block:'nearest'}); $('histClose').focus();}
  function closeSheet(){$('scrim').hidden=true; $('sheet').hidden=true; $('guide').hidden=true;}
  $('histBtn').onclick=openSheet; $('histClose').onclick=closeSheet; $('scrim').onclick=closeSheet;
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet();});
  let clearArm=null;
  $('histClear').onclick=()=>{
    const b=$('histClear');
    if(!clearArm){b.textContent='Confirm'; clearArm=setTimeout(()=>{clearArm=null; b.textContent='Clear';},3000); return;}
    clearTimeout(clearArm); clearArm=null; b.textContent='Clear';
    history=[]; curId=null; save(); renderHistory();
  };

  // crit threshold: one choice, 2+ to 6+; changing it re-reads the dice already in the tray
  for(let v=2;v<=6;v++){
    const b=document.createElement('button'); b.className='chk'; b.setAttribute('role','radio'); b.setAttribute('aria-label','Critical hits on '+v+' or higher');
    b.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>'; b.style.color='var(--phos-ink)';
    b.onclick=()=>setCrit(v); $('critSeg').appendChild(b);
  }
  function markCrit(){$('critSeg').querySelectorAll('.chk').forEach((b,i)=>b.setAttribute('aria-checked',String(i+2===crit)));}
  function setCrit(v){
    if(busy||v===crit) return; crit=v; markCrit();
    if(!rolls.length||!target) return;
    cells.forEach(c=>{c.classList.remove('hit','miss','land'); clearFx(c);});
    const {hits,crits}=paintResult(null);
    if(!$('res').classList.contains('idle')){
      $('hits').textContent=hits-crits; $('crits').textContent=crits; $('fails').textContent=rolls.length-hits; tick();
      $('sub').textContent=subText(hits,rolls.length);
    }
    syncButtons(hits);
    const e=history.find(x=>x.id===curId);
    if(e){e.crit=crit; e.critsText=String(crits); e.failsText=$('fails').textContent; e.hitsText=$('hits').textContent; e.sub=$('sub').textContent; save(); renderHistory();}
  }

  // ---- guide: how fair is the roll? (opens once on first visit, then from ? Guide) ----
  // the guide opens on every launch unless 'Don’t show on launch' is ticked
  const GKEY='dicehammer-guide-skip';
  const skipNext=()=>{try{return localStorage.getItem(GKEY)==='1';}catch(_){return false;}};
  const bars=(vals,cls,cap)=>{ // axis runs 16.4% to 17.0% on both charts so they compare directly
    const h=v=>((v-16.4)/0.6*100).toFixed(1);
    return '<div class="ga ga-bars '+cls+'" style="--fair:'+h(100/6)+'"><div class="gb-plot">'+vals.map(v=>'<div class="gb-col"><b>'+v.toFixed(2)+'</b><i style="--h:'+h(v)+'"></i></div>').join('')+
      '</div><div class="gb-x">'+[1,2,3,4,5,6].map(n=>'<span>'+n+'</span>').join('')+'</div><div class="gb-cap"><span>'+cap+'</span><em>--- fair</em></div></div>';
  };
  const pairs=(die,app)=>{ // real dice (grey) beside the app (green) for each face, same 16.4–17.0% axis
    const h=v=>((v-16.4)/0.6*100).toFixed(1);
    return '<div class="ga ga-bars" style="--fair:'+h(100/6)+'"><div class="gb-plot">'+die.map((v,k)=>'<div class="gb-col"><div class="gb-pair"><i class="d" style="--h:'+h(v)+'"></i><i class="a" style="--h:'+h(app[k])+'"></i></div></div>').join('')+
      '</div><div class="gb-x">'+[1,2,3,4,5,6].map(n=>'<span>'+n+'</span>').join('')+'</div><div class="gb-cap"><span><u class="kd"></u>Real dice <u class="ka"></u>DiceHammer</span><em>--- fair</em></div></div>';
  };
  const dieArt='<div class="gv-die">'+[0,1,2,3,4,5,6,7,8].map(i=>'<i class="'+([0,2,3,5,6,8].includes(i)?'s':'')+'"></i>').join('')+'</div>';
  const GUIDE=[
    {t:'Welcome to DiceHammer',b:'A dice tray for big tabletop wargame rolls. Before you start, here is how fair each roll is.',
     art:'<div class="ga ga-welcome"><div class="gw-title">DICEHAMMER<i></i></div><div class="gw-dice"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>'},
    {t:'Fairer than real dice',b:'Real dice favour some faces, and throws lean toward the side that starts face-up. DiceHammer’s <b>secure random generator</b> makes every face <b>exactly 1 in 6</b>.',
     cite:'Sources: <a href="https://doi.org/10.1080/01621459.2025.2516210" target="_blank" rel="noopener">Bartoš et al., JASA, 2025</a> (350,757 coin flips) · <a href="https://doi.org/10.1063/1.4746038" target="_blank" rel="noopener">Kapitaniak et al., Chaos, 2012</a> (dice) · chart: <a href="https://www.gwern.net/doc/statistics/probability/2009-labby.pdf" target="_blank" rel="noopener">Labby, CHANCE, 2009</a>',
     art:pairs([16.86,16.51,16.62,16.58,16.55,16.88],[16.67,16.68,16.69,16.65,16.65,16.66])},
    {t:'Fair, just steadier',b:'Neither is “truly” random: a die is physics too quick to predict, the app is maths too secure to predict. Both are fair; the app just never wobbles. Reopen this from <b>? Guide</b>.',
     art:'<div class="ga ga-vs"><div class="gv">'+dieArt+'<b>Die</b><span>physics</span></div><div class="gv-eq">≈</div><div class="gv"><div class="gv-chip"></div><b>App</b><span>secure maths</span></div></div>'}
  ];
  let gi=0, gReturn=null;
  function openGuide(i){
    if($('guide').hidden) gReturn=document.activeElement;
    gi=Math.max(0,Math.min(GUIDE.length-1,i)); const s=GUIDE[gi], last=gi===GUIDE.length-1;
    $('guide').innerHTML='<div class="g-head"><div><div class="k-lbl">Guide · '+(gi+1)+' of '+GUIDE.length+'</div><h2 id="g-title">'+s.t+'</h2></div><button class="btn g-x" aria-label="Close guide">✕</button></div>'+
      '<div class="g-slide" aria-hidden="true">'+s.art+'</div><p class="g-body" id="g-body">'+s.b+'</p><p class="g-cite">'+(s.cite||'')+'</p>'+
      '<div class="g-dots" role="tablist" aria-label="Guide steps">'+GUIDE.map((x,k)=>'<button role="tab" aria-selected="'+(k===gi)+'" aria-label="Step '+(k+1)+': '+x.t+'" data-g="'+k+'"></button>').join('')+'</div>'+
      '<label class="g-skip"><button class="chk" role="checkbox" id="gSkipNext" aria-checked="'+skipNext()+'"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg></button><span>Don’t show on launch</span></label>'+
      '<div class="g-nav">'+(gi?'<button class="btn" data-g="'+(gi-1)+'">Back</button>':'<button class="btn" id="gSkip">Skip</button>')+
      '<button class="btn primary" '+(last?'id="gDone"':'data-g="'+(gi+1)+'"')+'>'+(last?'Start rolling':'Next')+'</button></div>';
    $('scrim').hidden=false; $('guide').hidden=false;
    $('guide').querySelector('#gSkipNext').onclick=e=>{const b=e.currentTarget, on=b.getAttribute('aria-checked')!=='true'; b.setAttribute('aria-checked',String(on)); try{on?localStorage.setItem(GKEY,'1'):localStorage.removeItem(GKEY);}catch(_){}};
    const g=$('guide');
    g.querySelector('.g-x').onclick=closeGuide;
    const sk=g.querySelector('#gSkip'); if(sk) sk.onclick=closeGuide;
    const dn=g.querySelector('#gDone'); if(dn) dn.onclick=closeGuide;
    g.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const fromDots=!!b.closest('.g-dots'); openGuide(+b.dataset.g); (fromDots?g.querySelector('.g-dots [aria-selected="true"]'):g.querySelector('.g-nav .primary')).focus();});
    g.querySelector('.g-nav .primary').focus({preventScroll:true});
  }
  function closeGuide(){ $('guide').hidden=true; $('scrim').hidden=true; if(gReturn&&gReturn.focus) gReturn.focus(); }
  $('guide').addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'&&gi<GUIDE.length-1) openGuide(gi+1);
    else if(e.key==='ArrowLeft'&&gi>0) openGuide(gi-1);
  });
  let gsx=null;
  $('guide').addEventListener('pointerdown',e=>{gsx=e.clientX;});
  $('guide').addEventListener('pointerup',e=>{ if(gsx===null) return; const dx=e.clientX-gsx; gsx=null;
    if(Math.abs(dx)>50){ if(dx<0&&gi<GUIDE.length-1) openGuide(gi+1); else if(dx>0&&gi>0) openGuide(gi-1); } });
  $('guideBtn').onclick=()=>openGuide(0);
  // menu: one button in the header that holds Roll log and Guide
  function setMenu(open){ $('menu').hidden=!open; $('menuBtn').setAttribute('aria-expanded',String(open)); if(open) $('menu').querySelector('.m-item').focus({preventScroll:true}); }
  $('menuBtn').onclick=e=>{ e.stopPropagation(); setMenu($('menu').hidden); };
  $('menu').addEventListener('click',()=>setMenu(false));
  document.addEventListener('click',e=>{ if(!$('menu').hidden && !e.target.closest('.menu-wrap')) setMenu(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('menu').hidden){ setMenu(false); $('menuBtn').focus(); } });

  function markSize(){
    $('sizeSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.size===size)));
    $('sizeNote').textContent=N+'×'+N+' · up to '+N*N;
  }
  // changing size rebuilds the tray, keeps the pool if it still fits (otherwise trims it) and clears the current roll
  function setSize(k,quiet){
    if(!SIZES[k]||(k===size&&!quiet)||busy) return;
    size=k; N=SIZES[k]; try{localStorage.setItem('dicehammer-size',k);}catch(_){}
    buildGrid(); markSize(); fit();
    const n=Math.min(count||1,N*N); count=0; slots=[]; setCount(n);
  }
  $('sizeSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setSize(b.dataset.size);});

  // random CRT flicker roughly once a minute (45–75 s apart), skipped when the tab is hidden or motion is reduced
  function flicker(){ if(reduce||document.hidden) return; const b=document.body; b.classList.remove('flicker'); void b.offsetWidth; b.classList.add('flicker'); setTimeout(()=>b.classList.remove('flicker'),750); }
  (function schedule(){ setTimeout(()=>{ flicker(); schedule(); }, 45000+Math.random()*30000); })();
  // the action buttons above the dice (Sort, Re-roll 1s, Re-roll fails, Remove fails) also trigger the flicker
  document.querySelector('.acts').addEventListener('click',e=>{ if(e.target.closest('button')) flicker(); /* disabled buttons never fire click, and the reroll handlers disable themselves before this runs */ });

  count=0; setCount(10); markFaces(); markCrit(); markSize(); renderHistory(); fit();
  if(!skipNext()) openGuide(0);
})();
</script>
</body>
</html>
